name: Clearline Android

on:
  push:
    paths:
      - "clearline/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/clearline.yml"
  pull_request:
    paths:
      - "clearline/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/clearline.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Test & APK
        run: ./gradlew :clearline:testDebugUnitTest :clearline:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clearline-debug-apk
          path: clearline/build/outputs/apk/debug/*.apk
