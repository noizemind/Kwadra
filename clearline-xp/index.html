<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Clearline</title>
  <link rel="stylesheet" type="text/css" href="aero.css">
</head>
<body bgcolor="#9ED4F7">
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
    <tr><td class="brand">
      <table width="100%" border="0" cellpadding="10" cellspacing="0">
        <tr>
          <td><div class="logo">Clearline</div><div class="tag">LAN chat</div></td>
          <td align="right"><span id="status" class="status">…</span></td>
        </tr>
      </table>
    </td></tr>
    <tr>
      <td>
        <table width="100%" border="0" cellpadding="10" cellspacing="0">
          <tr>
            <td width="30%" valign="top" class="side">
              <div class="pane-title">Peers</div>
              <div id="peers" class="peers">waiting…</div>
              <div class="pane-title">Your name</div>
              <input type="text" id="nick" class="field" value="Guest" size="16">
            </td>
            <td valign="top" class="main">
              <div class="pane-title">Chat</div>
              <div id="chat" class="chat"></div>
              <input type="text" id="msg" class="field wide" value="">
              <input type="button" class="btn" value="Send" onclick="sendChat();">
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <script type="text/javascript" src="xp.js"></script>
</body>
</html>
